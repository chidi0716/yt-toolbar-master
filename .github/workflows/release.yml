# 發佈流程（plan 4.10、008 FR-50 至 FR-52）：推送 v* 標籤時建立 GitHub Release。
#
# 本專案不使用自己的簽章金鑰（008 FR-51）：components.json 列出每個檔案的 SHA256。
#
# 選用的 Secrets（Settings → Secrets and variables → Actions，見 README「維護者」章節）：
#   AMO_JWT_ISSUER       Mozilla 附加元件 API 金鑰（JWT issuer）
#   AMO_JWT_SECRET       Mozilla 附加元件 API 金鑰（JWT secret）
# 沒有設定時照常發佈：Firefox 版不送簽署，附上未簽署的套件，不產生 updates.json（008 FR-52）。
# 標籤含「-」（例如 v0.2.0-beta.1）時建立為預先發行版本，不會成為 releases/latest，
# 因此不會觸發新版本提醒、小幫手自動更新與 Firefox 自動更新。
name: Release

# 觸發方式：推送 v* 標籤，或推送 release 分支（標籤取 package.json 的版本，由這個流程建立）。
on:
  push:
    tags:
      - 'v*'
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # 建立 Release 與上傳檔案
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; bump the version in package.json" >&2
              exit 1
            fi
            echo "TAG=$tag" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      # 1. 安裝與測試
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: go test
        working-directory: host
        run: go vet ./... && go test ./...

      # 2–6. 建置擴充功能與小幫手、比對第三方工具的官方檢查碼、產生 components.json、
      #      有 Mozilla 金鑰時送簽署 Firefox 版並產生 updates.json、SHA256SUMS 與 Release 說明。
      - name: Build release files
        run: node scripts/release.mjs --tag "$TAG" --skip-tests
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" release/dist/upload/* \
            --target "$GITHUB_SHA" \
            --title "$(cat release/dist/release-title.txt)" \
            --notes-file release/dist/release-notes.md \
            $prerelease

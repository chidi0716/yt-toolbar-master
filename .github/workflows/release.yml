# 發佈流程（plan 4.10、008 FR-50 至 FR-52）：推送 v* 標籤時建立 GitHub Release。
#
# 本專案不使用自己的簽章金鑰（008 FR-51）：components.json 列出每個檔案的 SHA256。
#
# 選用的 Secrets（Settings → Secrets and variables → Actions，見 README「維護者」章節）：
#   AMO_JWT_ISSUER       Mozilla 附加元件 API 金鑰（JWT issuer）
#   AMO_JWT_SECRET       Mozilla 附加元件 API 金鑰（JWT secret）
# 沒有設定時照常發佈：Firefox 版不送簽署，附上未簽署的套件，不產生 updates.json（008 FR-52）。
# 標籤含「-」（例如 v0.2.0-beta.1）時建立為預先發行版本，不會成為 releases/latest，
# 因此不會觸發新版本提醒、小幫手自動更新與 Firefox 自動更新。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # 建立 Release 與上傳檔案
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      # 1. 安裝與測試
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: go test
        working-directory: host
        run: go vet ./... && go test ./...

      # 2–6. 建置擴充功能與小幫手、比對第三方工具的官方檢查碼、產生 components.json、
      #      有 Mozilla 金鑰時送簽署 Firefox 版並產生 updates.json、SHA256SUMS 與 Release 說明。
      - name: Build release files
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --skip-tests
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      # 不可變更版本開啟時，gh 會先建立草稿、上傳全部檔案後才發佈，發佈後檔案即無法修改。
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/dist/upload/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/dist/release-notes.md \
            --verify-tag $prerelease

name: Bug report / 問題回報
description: Something doesn't work as expected / 功能不正常
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / 發生了什麼事？
      description: What you expected and what happened instead. / 預期的結果與實際的結果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1. Open https://www.youtube.com/watch?v=...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / 瀏覽器
      options: [Chrome, Firefox, Zen, Other / 其他]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 作業系統
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Other / 其他]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version / 擴充功能版本
      description: Settings page → About. / 設定頁 →「關於」。
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: helper
    attributes:
      label: Download helper installed? / 是否安裝了下載小幫手？
      options: [Yes / 是, No / 否, Not sure / 不確定]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs / 截圖、錄影或記錄檔
      description: |
        Helper log / 小幫手記錄檔: macOS `~/Library/Logs/yt-toolbar-master/host.log`, Windows `%LOCALAPPDATA%\yt-toolbar-master\logs\host.log`

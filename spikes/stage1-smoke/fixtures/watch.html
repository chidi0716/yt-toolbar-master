<!doctype html>
<!--
  本機測試用的「觀看頁」：只模擬工具列與觀看輔助功能需要的結構，依 2026-10-21 實測 YouTube
  的元素層級寫成，內容全部是假的。由 Playwright 的 route 提供，瀏覽器不會連到 YouTube。

  模擬的部分：
  - 標題列（#masthead-container，固定在頂端）；
  - 播放器（#player > ... > #player-container > #movie_player），內含可播放的 <video>
    （/__fixture/test.webm，30 秒）與自動播放開關（.ytp-autonav-toggle-button[aria-checked]）；
  - #movie_player 上的播放器 API（getVideoData、seekTo、getVolume、setVolume 等）；
  - 標題、說明、留言區（#comments）、右側影片清單（站內換頁會發出 yt-navigate-finish）；
  - 播放器位於多層形成堆疊脈絡的祖先容器（#primary-inner、#player、#player-container-inner）內（T07a）；
  - YouTube 自己的劇院模式（播放器控制列的 Theater 按鈕，.ytp-size-button）：播放器容器被移到
    #full-bleed-container > #player-full-bleed-container，原本的 #player 隱藏（T08a）；
  - <html dark> 深色主題與顏色變數，以及模擬 YouTube 選單的「切換主題」按鈕。
  - 主題的實測行為（specs/notes/T06b-dark-mode-instant.md）：
    - YouTube 依載入時的主題輸出不同的樣式表：`:root` 的顏色變數預設值就是載入時的主題，另有
      `[dark]`、`[light]` 兩組覆寫，以及以 `:root:root` 固定的少數變數（這裡是「訂閱」按鈕的文字色）；
    - 頂端列（ytd-masthead[dark][page-dark-theme]）與 ytd-watch-flexy[is-dark-theme] 的屬性依載入時的主題設定；
    - 站內換頁時，依記憶中（載入時）的主題把頂端列的 dark 改回去，並以記憶中的偏好改寫 PREF（另加 f7=100）。
  - YouTube 的「外觀」選單（T06d，依 specs/notes/T06d-dark-mode-menu.md 的實測結構）：頂端列右側的
    ytd-topbar-menu-button-renderer 按鈕 → ytd-popup-container 中的 tp-yt-iron-dropdown →
    ytd-toggle-theme-compact-link-renderer（外觀）→ #submenu 中的 ytd-compact-link-renderer 選項，
    選項的 data 帶有動作代號（TOGGLE_DARK_THEME_ON／OFF）。選項的順序與文字刻意和 YouTube 不同，
    確認擴充功能不靠順序或文字辨識。網址參數：
    - fixture_menu_reload=1：選擇後改寫 PREF 並重新載入頁面（模擬未登入時的 YouTube）；
      否則立即套用主題、選單維持打開（模擬已登入時的行為，由擴充功能負責關閉選單）；
    - fixture_no_appearance=1：選單中沒有「外觀」項目；fixture_no_menu_button=1：頂端列沒有選單按鈕（003 FR-15）。
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fixture watch page</title>
    <script>
      // 模擬 YouTube 依 PREF cookie 的 f6 旗標決定主題（實測：0x400 深色、0x80000 淺色）。
      // 兩者都沒有時模擬「使用裝置主題」：依 prefers-color-scheme（假設，真實行為見 T06a 筆記）。
      (function () {
        const pref = document.cookie.split('; ').find((c) => c.startsWith('PREF='));
        const f6 = pref && /(?:^|&)f6=([0-9a-fA-F]+)/.exec(pref.slice(5));
        const flags = f6 ? parseInt(f6[1], 16) : 0;
        const dark =
          flags & 0x400 ? true : flags & 0x80000 ? false : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('dark', '');
        // 模擬 YouTube 記憶中的主題與偏好（站內換頁時用來改回去）
        window.__fixtureLoadDark = dark;
        window.__fixtureThemeMemoryDark = dark;
        window.__fixturePrefMemory = pref ? pref.slice(5) : '';

        const lightVars = {
          'text-primary': '#0f0f0f',
          'text-secondary': '#606060',
          'menu-background': '#fff',
          'base-background': '#fff',
          'additive-background': 'rgba(0, 0, 0, 0.05)',
          'button-chip-background-hover': 'rgba(0, 0, 0, 0.1)',
          'call-to-action': '#065fd4',
          outline: 'rgba(0, 0, 0, 0.1)',
          'text-primary-inverse': '#fff',
          'text-disabled': '#909090',
        };
        const darkVars = {
          'text-primary': '#f1f1f1',
          'text-secondary': '#aaa',
          'menu-background': '#282828',
          'base-background': '#0f0f0f',
          'additive-background': 'rgba(255, 255, 255, 0.1)',
          'button-chip-background-hover': 'rgba(255, 255, 255, 0.2)',
          'call-to-action': '#3ea6ff',
          outline: 'rgba(255, 255, 255, 0.2)',
          'text-primary-inverse': '#0f0f0f',
          'text-disabled': '#717171',
        };
        const decl = (vars) =>
          Object.entries(vars)
            .map(([k, v]) => `--yt-sys-color-baseline--${k}: ${v};`)
            .join(' ');
        let css = `:root { ${decl(dark ? darkVars : lightVars)} }`;
        css += ` :root:root { --fixture-pinned-inverse: ${dark ? '#0f0f0f' : '#f1f1f1'}; }`;
        css += ` [dark] { ${decl(darkVars)} --fixture-pinned-inverse: #0f0f0f; }`;
        css += ` [light] { ${decl(lightVars)} --fixture-pinned-inverse: #fff; }`;
        const style = document.createElement('style');
        style.id = 'fixture-load-theme';
        style.textContent = css;
        document.head.appendChild(style);
      })();
    </script>
    <style>
      html {
        font-family: Roboto, Arial, sans-serif;
        background: var(--yt-sys-color-baseline--base-background);
        color: var(--yt-sys-color-baseline--text-primary);
      }
      ytd-masthead {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 100%;
      }
      /* 頂端列的部分顏色依 ytd-masthead[dark] 決定（實測：搜尋框） */
      #fixture-search {
        padding: 2px 12px;
        border: 1px solid #ccc;
        border-radius: 12px;
        color: #0f0f0f;
      }
      ytd-masthead[dark] #fixture-search {
        border-color: #303030;
        color: #f1f1f1;
      }
      /* 觀看頁的部分顏色依 ytd-watch-flexy[is-dark-theme] 決定 */
      #fixture-description {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.05);
      }
      ytd-watch-flexy[is-dark-theme] #fixture-description {
        background: rgba(255, 255, 255, 0.1);
      }
      /* 「訂閱」按鈕：背景隨 [dark]／[light]，文字色是被 :root:root 固定的變數 */
      #fixture-subscribe {
        margin-top: 8px;
        padding: 8px 16px;
        border: 0;
        border-radius: 18px;
        background: var(--yt-sys-color-baseline--text-primary);
        color: var(--fixture-pinned-inverse);
        font: inherit;
      }
      tp-yt-iron-dropdown {
        position: fixed;
        top: 48px;
        right: 16px;
        z-index: 2202;
        width: 280px;
        padding: 8px 0;
        border-radius: 12px;
        background: var(--yt-sys-color-baseline--menu-background);
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.2);
      }
      tp-yt-iron-dropdown [role='link'],
      tp-yt-iron-dropdown a {
        display: block;
        padding: 8px 16px;
        cursor: pointer;
      }
      /* YouTube 自己的劇院模式（加寬播放器）：播放器容器被移到全寬區，原本的位置隱藏（T08a 依實測結構模擬）。 */
      ytd-watch-flexy[theater] #player-full-bleed-container {
        position: relative;
        height: 560px;
        background: #000;
      }
      ytd-watch-flexy[theater] #player {
        display: none;
      }
      body {
        margin: 0;
      }
      ytd-app,
      ytd-watch-flexy,
      ytd-watch-metadata,
      ytd-player,
      ytd-comments {
        display: block;
      }
      #masthead-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2020;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: var(--yt-sys-color-baseline--base-background);
      }
      #page-manager {
        padding-top: 56px;
      }
      #columns {
        display: flex;
        gap: 24px;
        padding: 24px;
      }
      #primary {
        flex: 1;
        min-width: 0;
      }
      #secondary {
        width: 360px;
      }
      /*
       * 專案擁有者回報的情境（T07a）：播放器位於多層形成堆疊脈絡（position＋z-index）的祖先容器內，
       * 播放器與工具列提高 z-index 也無法跳出這些容器，整頁遮罩會連播放器與工具列一起蓋住。
       */
      #primary-inner {
        position: relative;
        z-index: 0;
      }
      #player {
        position: relative;
        z-index: 1;
      }
      #player-container-inner {
        position: relative;
        z-index: 0;
        padding-top: 56.25%;
      }
      #player-container {
        position: absolute;
        inset: 0;
      }
      ytd-player,
      ytd-player #container,
      #movie_player {
        width: 100%;
        height: 100%;
      }
      #movie_player {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
      }
      .html5-video-container,
      .html5-main-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .ytp-chrome-bottom {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      .ytp-button {
        padding: 4px 8px;
        border: 0;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: inherit;
        font-size: 12px;
      }
      .ytp-autonav-toggle-button {
        display: inline-block;
        width: 28px;
        height: 12px;
        margin-left: 4px;
        border-radius: 6px;
        background: #717171;
        vertical-align: middle;
      }
      .ytp-autonav-toggle-button[aria-checked='true'] {
        background: #fff;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 20px;
      }
      #comments {
        margin-top: 24px;
        padding: 16px;
        border: 1px dashed var(--yt-sys-color-baseline--outline);
      }
      .filler {
        height: 1600px;
      }
      #secondary a {
        display: block;
        margin-bottom: 8px;
        color: var(--yt-sys-color-baseline--call-to-action);
      }
    </style>
  </head>
  <body>
    <ytd-app>
      <div id="masthead-container">
        <ytd-masthead id="masthead">
          <strong>Fixture</strong>
          <span id="fixture-search">Search</span>
          <button id="fixture-theme-toggle" type="button">Theme (YouTube menu)</button>
          <div id="end">
            <div id="buttons">
              <ytd-topbar-menu-button-renderer><button id="fixture-menu-button" type="button" aria-label="Settings">⋮</button></ytd-topbar-menu-button-renderer>
            </div>
          </div>
        </ytd-masthead>
      </div>
      <div id="page-manager">
        <ytd-watch-flexy>
          <div id="full-bleed-container"><div id="player-full-bleed-container"></div></div>
          <div id="columns">
            <div id="primary">
              <div id="primary-inner">
                <div id="player">
                  <div id="player-container-outer">
                    <div id="player-container-inner">
                      <div id="player-container">
                        <ytd-player id="ytd-player">
                          <div id="container">
                            <div id="movie_player" class="html5-video-player">
                              <div class="html5-video-container">
                                <video class="html5-main-video" src="/__fixture/test.webm" preload="auto" playsinline></video>
                              </div>
                              <div class="ytp-chrome-bottom">
                                <button class="ytp-button" id="fixture-play" type="button">Play/Pause</button>
                                <button class="ytp-button ytp-size-button" id="fixture-theater" type="button">Theater</button>
                                <button class="ytp-button" data-tooltip-target-id="ytp-autonav-toggle-button" type="button">
                                  Autoplay<span class="ytp-autonav-toggle-button" aria-checked="true"></span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </ytd-player>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="below">
                  <div id="shopping-timely-shelf"></div>
                  <div>
                    <ytd-watch-metadata>
                      <div id="title"><h1>Fixture video</h1></div>
                      <button id="fixture-subscribe" type="button">Subscribe</button>
                      <div id="fixture-description">Description (fixture)</div>
                    </ytd-watch-metadata>
                  </div>
                  <ytd-comments id="comments"><p id="fixture-comments-text">Comments section (fixture)</p></ytd-comments>
                  <div class="filler"></div>
                </div>
              </div>
            </div>
            <div id="secondary">
              <a id="next" href="/watch?v=aaaaaaaaaaa">Next video</a>
              <a id="next2" href="/watch?v=bbbbbbbbbbb">Another video</a>
            </div>
          </div>
        </ytd-watch-flexy>
      </div>
      <ytd-popup-container>
        <tp-yt-iron-dropdown id="fixture-dropdown" aria-hidden="true" style="display: none"></tp-yt-iron-dropdown>
      </ytd-popup-container>
    </ytd-app>
    <script>
      const player = document.getElementById('movie_player');
      const video = player.querySelector('video');
      const autonav = player.querySelector('.ytp-autonav-toggle-button');

      // 模擬 YouTube 播放器 API（只有頁面橋接腳本會用到的方法）。
      const videoId = () => new URL(location.href).searchParams.get('v');
      player.getVideoData = () => ({ video_id: videoId(), title: document.querySelector('h1').textContent, isLive: false });
      player.getPlayerResponse = () => ({ videoDetails: { isLive: false, isUpcoming: false, lengthSeconds: '30' } });
      player.getDuration = () => video.duration;
      player.getCurrentTime = () => video.currentTime;
      player.seekTo = (s) => {
        video.currentTime = s;
      };
      player.getVolume = () => Math.round(video.volume * 100);
      player.setVolume = (v) => {
        video.volume = Math.max(0, Math.min(100, v)) / 100;
      };
      player.isMuted = () => video.muted;
      player.unMute = () => {
        video.muted = false;
      };

      document.getElementById('fixture-play').addEventListener('click', () => (video.paused ? video.play() : video.pause()));

      // 自動播放開關：點按鈕切換 aria-checked。
      autonav.closest('button').addEventListener('click', () => {
        autonav.setAttribute('aria-checked', String(autonav.getAttribute('aria-checked') !== 'true'));
      });

      // 模擬 YouTube 依載入時的主題設定在元素上的主題屬性。
      const masthead = document.getElementById('masthead');
      const flexy = document.querySelector('ytd-watch-flexy');
      const setElementTheme = (dark) => {
        masthead.toggleAttribute('dark', dark);
        masthead.toggleAttribute('page-dark-theme', dark);
        flexy.toggleAttribute('is-dark-theme', dark);
      };
      setElementTheme(window.__fixtureLoadDark);
      const writePref = (value) => {
        document.cookie = 'PREF=' + value + '; domain=.youtube.com; path=/; max-age=34560000; secure; samesite=lax';
      };

      // YouTube 套用使用者選擇的主題：改寫 PREF 的 f6 旗標並立即套用（假設可即時切換，例如登入帳號）。
      // （未登入時真實的 YouTube 選單會重新載入頁面，見 T06b、T06d 筆記；以 fixture_menu_reload=1 模擬。）
      const themePrefValue = (dark) => {
        const pref = (document.cookie.split('; ').find((c) => c.startsWith('PREF=')) || 'PREF=').slice(5);
        const fields = pref ? pref.split('&').map((p) => p.split('=')) : [];
        const i = fields.findIndex(([k]) => k === 'f6');
        const flags = i === -1 ? 0 : parseInt(fields[i][1], 16);
        const next = ((flags & ~0x80400) | (dark ? 0x400 : 0x80000)).toString(16);
        if (i === -1) fields.push(['f6', next]);
        else fields[i] = ['f6', next];
        return fields.map((f) => f.join('=')).join('&');
      };
      const applyYouTubeTheme = (dark) => {
        const value = themePrefValue(dark);
        writePref(value);
        window.__fixturePrefMemory = value;
        window.__fixtureThemeMemoryDark = dark;
        document.documentElement.toggleAttribute('dark', dark);
        document.documentElement.toggleAttribute('light', !dark && window.__fixtureLoadDark);
        setElementTheme(dark);
      };

      // 模擬使用者自己從 YouTube 選單切換主題（直接套用，不經過下面的選單）。
      document.getElementById('fixture-theme-toggle').addEventListener('click', () => {
        applyYouTubeTheme(!document.documentElement.hasAttribute('dark'));
      });

      // 模擬 YouTube 的帳號／設定選單與「外觀」子選單（結構依 T06d 實測）。window.__fixtureMenuLog 記錄操作。
      const params = new URL(location.href).searchParams;
      const menuButton = document.getElementById('fixture-menu-button');
      const dropdown = document.getElementById('fixture-dropdown');
      window.__fixtureMenuLog = [];
      if (params.get('fixture_no_menu_button') === '1') menuButton.closest('ytd-topbar-menu-button-renderer').remove();
      const isOpen = () => dropdown.style.display !== 'none';
      const closeMenu = () => {
        dropdown.style.display = 'none';
        dropdown.setAttribute('aria-hidden', 'true');
        dropdown.replaceChildren();
        window.__fixtureMenuLog.push('close');
      };
      const el = (tag, attrs = {}, ...children) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        e.append(...children);
        return e;
      };
      const linkItem = (label, signal) => {
        const item = el('ytd-compact-link-renderer', { 'compact-link-style': 'compact-link-style-type-selection-menu' }, el('a', { id: 'endpoint', role: 'link' }, label));
        // YouTube 元件的 data（頁面 JavaScript 的屬性，不是 DOM 屬性）
        item.data = { title: { runs: [{ text: label }] }, serviceEndpoint: { signalServiceEndpoint: { signal: 'CLIENT_SIGNAL', actions: [{ signalAction: { signal } }] } } };
        return item;
      };
      const openAppearanceSubmenu = () => {
        window.__fixtureMenuLog.push('appearance');
        // 刻意與 YouTube 不同的順序與文字
        const items = [linkItem('選項甲', 'TOGGLE_DARK_THEME_DEVICE_FIXTURE'), linkItem('選項乙', 'TOGGLE_DARK_THEME_OFF'), linkItem('選項丙', 'TOGGLE_DARK_THEME_ON')];
        for (const item of items) {
          item.querySelector('a').addEventListener('click', () => {
            const signal = item.data.serviceEndpoint.signalServiceEndpoint.actions[0].signalAction.signal;
            window.__fixtureMenuLog.push(`select:${signal}`);
            if (signal === 'TOGGLE_DARK_THEME_DEVICE_FIXTURE') return;
            const dark = signal === 'TOGGLE_DARK_THEME_ON';
            if (params.get('fixture_menu_reload') === '1') {
              writePref(themePrefValue(dark));
              location.reload();
              return;
            }
            applyYouTubeTheme(dark);
          });
        }
        dropdown.replaceChildren(el('ytd-multi-page-menu-renderer', {}, el('div', { id: 'submenu' }, el('ytd-multi-page-menu-renderer', {}, el('div', { id: 'sections' }, ...items)))));
      };
      menuButton.addEventListener('click', () => {
        if (isOpen()) return closeMenu();
        window.__fixtureMenuLog.push('open');
        dropdown.style.display = '';
        dropdown.removeAttribute('aria-hidden');
        dropdown.replaceChildren(el('div', { id: 'spinner' }, '…'));
        // 模擬選單內容向伺服器載入（已登入時）
        setTimeout(() => {
          if (!isOpen()) return;
          const items = [el('ytd-compact-link-renderer', {}, el('a', { id: 'endpoint', role: 'link' }, 'Your data'))];
          if (params.get('fixture_no_appearance') !== '1') {
            const toggle = el('ytd-toggle-theme-compact-link-renderer', { role: 'link', tabindex: '0' }, el('div', { id: 'label' }, '外觀'));
            toggle.addEventListener('click', openAppearanceSubmenu);
            items.push(toggle);
          }
          dropdown.replaceChildren(el('ytd-multi-page-menu-renderer', {}, el('div', { id: 'sections' }, ...items)));
        }, 300);
      });

      // 模擬站內換頁時 YouTube 依記憶中的狀態改回主題：頂端列的 dark 屬性，以及以記憶中的偏好
      // 改寫 PREF（實測會另外加上 f7=100，主題旗標是舊的）。
      const simulateStaleTheme = () => {
        masthead.toggleAttribute('dark', window.__fixtureThemeMemoryDark);
        const fields = window.__fixturePrefMemory ? window.__fixturePrefMemory.split('&').map((p) => p.split('=')) : [];
        if (!fields.some(([k]) => k === 'f7')) fields.push(['f7', '100']);
        window.__fixturePrefMemory = fields.map((f) => f.join('=')).join('&');
        writePref(window.__fixturePrefMemory);
      };

      // 模擬 YouTube 自己的劇院模式：把播放器容器移到全寬區，原本的位置隱藏（實測真實頁面的結構）。
      document.getElementById('fixture-theater').addEventListener('click', () => {
        const watch = document.querySelector('ytd-watch-flexy');
        const playerContainer = document.getElementById('player-container');
        const theater = !watch.hasAttribute('theater');
        watch.toggleAttribute('theater', theater);
        (theater ? document.getElementById('player-full-bleed-container') : document.getElementById('player-container-inner')).append(playerContainer);
        window.dispatchEvent(new Event('resize'));
      });

      // 模擬 YouTube 的 t 參數：載入後跳到指定的秒數。
      const startAt = /^(\d+)s?$/.exec(new URL(location.href).searchParams.get('t') || '');
      if (startAt) {
        if (video.readyState >= 1) video.currentTime = Number(startAt[1]);
        else video.addEventListener('loadedmetadata', () => (video.currentTime = Number(startAt[1])), { once: true });
      }

      // 模擬 YouTube 的站內換頁：改網址並發出 yt-navigate-finish。
      for (const a of document.querySelectorAll('#secondary a')) {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          history.pushState({}, '', e.currentTarget.getAttribute('href'));
          document.querySelector('h1').textContent = 'Fixture video ' + videoId();
          video.currentTime = 0;
          simulateStaleTheme();
          document.dispatchEvent(new CustomEvent('yt-navigate-finish'));
        });
      }
    </script>
    <script src="/__fixture/stage2c-watch.js"></script>
  </body>
